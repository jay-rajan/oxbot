[package]
name = "oxbot-desktop"
description = "The oxbot app: on a Mac the home computer (server inside, chat page as its window, menu bar icon); on Android a device onto the home computer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "oxbot_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oxbot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow.workspace = true
tracing.workspace = true

# The Mac app: the home computer. None of this is built for a phone.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
oxbot.workspace = true
oxbot-core.workspace = true
oxbot-protocol.workspace = true
# tauri.conf.json's plugin settings are read into the app as JSON.
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
# Posts usage alerts to Notification Center, locally (its Rust API only;
# the page gets no permission to use it).
tauri-plugin-notification = "2.8.0"
# oxbot's own updates: checks the signed feed on GitHub Releases, downloads
# the new app and checks its signature with the update key's public half.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "zip"] }
chrono.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

# The phone app (Android and iPhone): a device only.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Files sent from the phone cross from its page as base64 text: Android's
# bridge can't carry raw bytes. Already in the build; no new crate.
base64 = "0.22.1"
futures-util.workspace = true
oxbot-device.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
# Opens the family's Records, kept on the phone, in the phone's own apps.
tauri-plugin-open-record = { path = "../../crates/tauri-plugin-open-record" }
# Reads the pairing QR code on the phone itself (pure Rust): no Google
# Play services or ML Kit, which would talk to Google.
rqrr = { version = "0.11.0", default-features = false }
tokio.workspace = true

# Opens web links in the phone's browser (an Android intent). Already in the
# build through Tauri's webview; no new crate.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

# Opens web links in Safari: Tauri's own plugin (its Swift side calls
# UIApplication.open), since oxbot's Rust has no unsafe code.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-opener = "=2.7.2"

[lints]
workspace = true
