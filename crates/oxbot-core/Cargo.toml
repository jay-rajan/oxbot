[package]
name = "oxbot-core"
description = "Bots, their history store and the hub that runs them: oxbot's logic without networking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
oxbot-browser.workspace = true
oxbot-claude.workspace = true
oxbot-protocol.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# Tests only: a viewer known only by name becomes a person the first time
# the hub sees them (see `HubConfig::enrol_named_viewers`). Never on in a
# normal build: there, people are made only on purpose.
test-people = []

[dev-dependencies]
# This crate's own tests use the test-only feature.
oxbot-core = { path = ".", features = ["test-people"] }
tempfile.workspace = true

[lints]
workspace = true
