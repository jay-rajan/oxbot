[package]
name = "oxbot-core"
description = "Bots, their history store and the hub that runs them: oxbot's logic without networking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Files sent with messages (see `attach`).
calamine.workspace = true
dirs.workspace = true
infer.workspace = true
oxbot-browser.workspace = true
oxbot-claude.workspace = true
oxbot-codex.workspace = true
oxbot-engine.workspace = true
oxbot-llm.workspace = true
oxbot-loop.workspace = true
oxbot-protocol.workspace = true
oxbot-relay.workspace = true
# Migration 9's frozen copy of `site_of` names sites with it.
psl.workspace = true
# Renders research reports (see `report`).
pulldown-cmark.workspace = true
quick-xml.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[features]
# Tests only: a viewer known only by name becomes a person the first time
# the hub sees them (see `HubConfig::enrol_named_viewers`). Never on in a
# normal build: there, people are made only on purpose.
test-people = []
# Tests and the end-to-end seed only: `Store::open_at_version` makes a
# database as an older oxbot left it.
test-support = []

[dev-dependencies]
# This crate's own tests use the test-only feature.
oxbot-core = { path = ".", features = ["test-people", "test-support"] }
# Scripted model and browser for the loop engine's hub tests.
oxbot-llm = { workspace = true, features = ["test-model"] }
oxbot-loop = { workspace = true, features = ["test-tools"] }
tempfile.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
