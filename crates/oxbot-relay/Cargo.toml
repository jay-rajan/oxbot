[package]
name = "oxbot-relay"
description = "oxbot's model relay on 127.0.0.1: the only place a Codex process may send model requests. It checks each request's per-process token, strips what identifies anyone, applies the bot's model, privacy and limits through the loop's gateway, forwards to OpenRouter's Responses API with the household key, meters and logs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
