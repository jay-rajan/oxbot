[package]
name = "oxbot-llm"
description = "A model client for OpenAI-style chat APIs (OpenRouter now, local servers later): provider-neutral messages, streaming, errors, OpenRouter's model list, key info and sign-in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# ScriptedModel, a ChatModel that answers from a script, for other crates'
# tests. Never in a normal build.
test-model = []

[dependencies]
bytes.workspace = true
futures-util.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Runs the scripted model's own tests in every `cargo test`.
oxbot-llm = { path = ".", features = ["test-model"] }

[lints]
workspace = true
