[package]
name = "oxbot"
description = "oxbot: always-on Claude bots on your Mac, reachable from your phone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util.workspace = true
if-addrs.workspace = true
mdns-sd.workspace = true
oxbot-browser.workspace = true
oxbot-core.workspace = true
oxbot-gate.workspace = true
oxbot-llm.workspace = true
oxbot-protocol.workspace = true
qrcode.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain, for the OpenRouter key.
security-framework.workspace = true

[dev-dependencies]
# Tests name people (`Viewer::gate("Sam")`) without pairing them first,
# and run stand-in bots on oxbot's own loop.
oxbot-core = { workspace = true, features = ["test-bots"] }
# A test makes a database as a newer oxbot would leave it.
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
