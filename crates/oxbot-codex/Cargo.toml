[package]
name = "oxbot-codex"
description = "The Codex engine: Codex CLI's app-server runs a bot's agent loop, while oxbot keeps the tools, the gate, the model relay, limits and the chat. One app-server process per bot (behind one function, to change later), with its own CODEX_HOME and a config oxbot writes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
futures-util.workspace = true
oxbot-engine.workspace = true
oxbot-llm.workspace = true
oxbot-loop.workspace = true
oxbot-relay.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
bytes.workspace = true
oxbot-llm = { workspace = true, features = ["test-model"] }
oxbot-loop = { workspace = true, features = ["test-tools"] }
tempfile.workspace = true

