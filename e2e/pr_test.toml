# How /pr_test builds and starts oxbot for end-to-end tests.
build = ["cargo build -p oxbot -p oxbot-e2e", "sh scripts/build-mac-helper.sh"]
server = "target/debug/oxbot"
# Bots run on Codex (0.148.x, installed separately): without it every test
# is skipped, saying why.
needs = ["codex"]
tools = "target/tools-bundle"
# The Farm's person in tests.
person = "Jay"
# Changes here also run the tests in Safari (the engine of the app's window).
safari_when = ["crates/oxbot/ui-src/**"]
# Changes here also run the Mac app check (needs the app built).
app_when = ["app/**", "scripts/make-dmg.sh", "docs/brand/**"]
app = "target/universal-apple-darwin/release/bundle/macos/oxbot.app"
app_build = ["./scripts/make-dmg.sh"]
# The stand-in for oxbot's Mac helper (dictation), and the real one (still
# frames from video; built by scripts/build-mac-helper.sh).
fake_mac = "target/debug/oxbot-fake-mac"
mac_helper = "target/mac-helper/oxbot-mac"
# Stand-ins for bots on either engine: OpenRouter (started for every test,
# with a canary key; Codex reaches it through oxbot's relay) and the browser
# tool (oxbot starts it, test mode only).
fake_openrouter = "target/debug/oxbot-fake-openrouter"
fake_devtools = "target/debug/oxbot-fake-devtools"
