name = "Claude bots take tasks only from the owner"
about = "Ann (a Gate) opens Recipes, a shared Claude bot: she can read its chat, but the message box says only Jay can give it tasks and Send is off. Her own Herder still takes messages."
covers = ["crates/oxbot/ui/**", "crates/oxbot/src/server.rs", "crates/oxbot-core/src/hub/engines.rs", "crates/oxbot-core/src/hub/engine_prefs.rs", "crates/oxbot-core/src/bot.rs", "crates/oxbot-protocol/**"]
as = "Ann"

[[step]]
click = "Recipes"
[[step]]
expect = "Red lentil dal"
note = "Others still read what the owner shares"
[[step]]
expect = "Only Jay can give this bot tasks"
[[step]]
expect = "owner only · Claude"
[[step]]
expect_disabled = "Send"
[[step]]
expect_js = "document.getElementById('input').disabled && document.getElementById('attach').hidden"
note = "No typing, no files"
[[step]]
expect_js = "document.getElementById('engineBadge').textContent === 'Claude'"
note = "The header says which engine"
shot = "owner-only"
[[step]]
click = "Herder"
[[step]]
expect_js = "!document.getElementById('input').disabled"
note = "Her own Herder takes messages"
[[step]]
expect_not = "Only Jay can give this bot tasks"
