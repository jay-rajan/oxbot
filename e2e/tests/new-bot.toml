name = "Making a shared bot"
about = "The + makes a bot; it shows \"by Jay\" with no colored dot (only unread dots are colored)."
covers = ["crates/oxbot/ui/**", "crates/oxbot-core/src/hub.rs", "crates/oxbot-core/src/bot.rs", "crates/oxbot/src/server.rs"]

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Daily News" }
[[step]]
type = { into = "What should it do?", text = "Give me five headlines when I ask." }
[[step]]
click = "Create"
[[step]]
wait_for = "@daily-news"
note = "The new bot opens"
[[step]]
expect = "by Jay"
[[step]]
expect_js = "!document.querySelector('.bot-item .maker-dot')"
note = "No colored dot next to the maker"
[[step]]
send = "hello"
[[step]]
wait_for = "Hello! I'm the stand-in Claude."
