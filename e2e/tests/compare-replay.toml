name = "A replay changes nothing and shows scores"
about = "The owner keeps a finished post as a test case and replays it on a free model: the post is recorded, never done (no approval request, nothing in the chat, no write reaches the site even though the test browser really loads its page), and the scoreboard shows the model with the original and the replay."
covers = ["crates/oxbot-core/src/hub/trials.rs", "crates/oxbot-core/src/hub/compare.rs", "crates/oxbot-core/src/compare.rs", "crates/oxbot-core/src/policy.rs", "crates/oxbot-core/src/hub/approvals.rs", "crates/oxbot-browser/src/netguard.rs", "crates/oxbot-browser/src/trial.rs", "crates/oxbot/src/compare.rs", "crates/oxbot/ui-src/**"]

[[step]]
click = "Recipes"
[[step]]
send = "post the nurse job"
[[step]]
wait_for = "Allow once"
note = "Live, the post asks first"
[[step]]
click = "Allow once"
[[step]]
wait_for = "Posted the nurse job."
[[step]]
expect_site_writes = 2
note = "The live turn's browser really opened the page, which posts twice by itself as it loads (a fetch and a form); the bot's own click asked first"
[[step]]
expect_js = "(() => { const b = [...document.querySelectorAll('#log .rate-row button')].filter((b) => b.textContent === 'Test case…').pop(); b.click(); return true; })()"
note = "Test case… under the reply that just ended"
[[step]]
wait_for = "Keep as a test case"
[[step]]
expect_js = "document.getElementById('caseRubric').value.includes('Would click button \"Post\" on jobs.example.test')"
note = "The checks start from the step the original asked about"
shot = "test-case-sheet"
[[step]]
click = "Keep"
[[step]]
wait_for = "✓ test case"
[[step]]
expect_js = "(() => { window.__chat = document.querySelectorAll('#log > *').length; return window.__chat > 0; })()"
note = "Remember how long the chat is"
[[step]]
right_click = "Recipes"
[[step]]
click = "Compare…"
[[step]]
click = "Test cases"
[[step]]
wait_for = "post the nurse job"
[[step]]
expect_js = "(() => { const box = document.querySelector('#cmpCaseList input[type=checkbox]'); box.click(); return box.checked; })()"
[[step]]
wait_for = "e2e/tool-model:free"
[[step]]
click = "e2e/tool-model:free"
note = "The model to replay it on"
[[step]]
click = "Estimate"
[[step]]
wait_for = "1 run"
shot = "estimate"
[[step]]
click = "Start"
[[step]]
wait_for = "running"
note = "Starting shows the run"
[[step]]
click = "Test cases"
[[step]]
wait_for = "1 of 1 · done"
timeout_ms = 90000
note = "The run has its own test browser"
[[step]]
expect_js = "!document.querySelector('#cards .card')"
note = "No approval request appeared"
[[step]]
expect_js = "document.querySelectorAll('#log > *').length === window.__chat"
note = "The chat gained nothing"
[[step]]
expect_site_pages = 2
note = "The run's test browser really loaded the site's page too (after the live turn's one)"
[[step]]
expect_site_writes = 2
note = "…and every write the page tried in it was blocked: still only the live turn's two"
[[step]]
click = "Runs"
[[step]]
expect_js = "(() => { const li = [...document.querySelectorAll('#cmpRunList li')].find((l) => l.querySelector('.list-title').textContent === 'post the nurse job · e2e/tool-model:free' && l.querySelector('small').textContent.startsWith('replay')); if (!li) return false; li.click(); return true; })()"
timeout_ms = 10000
note = "The replay (the original, on the same model, is listed too)"
[[step]]
wait_for = "✓ matched: click button \"Post\" on jobs.example.test"
[[step]]
expect = "Posted the nurse job (test run)."
[[step]]
expect = "blocked"
note = "The run shows what its browser blocked"
shot = "run-detail"
[[step]]
click = "✓"
[[step]]
click = "← Runs"
[[step]]
click = "Scoreboard"
[[step]]
wait_for = "e2e/tool-model:free"
[[step]]
expect_js = "(() => { const rows = [...document.querySelectorAll('#cmpScoreRows tr')].map((r) => r.textContent); return rows.length === 1 && rows[0].startsWith('e2e/tool-model:free2100%'); })()"
note = "One row for the model: the original and the replay, the marked replay passes"
shot = "scoreboard"
