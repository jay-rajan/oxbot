name = "Connect OpenRouter"
about = "The owner connects (the stand-in) OpenRouter from Settings → General → AI: the sign-in page comes back to oxbot, which keeps the key out of every file, and the AI section then shows it connected, with today's free questions from the new key."
covers = ["crates/oxbot/src/openrouter_auth.rs", "crates/oxbot/src/keychain.rs", "crates/oxbot/src/server.rs", "crates/oxbot/src/runtime.rs", "crates/oxbot/ui-src/**", "crates/oxbot-core/src/hub/engine_prefs.rs", "crates/oxbot-protocol/**"]
openrouter_signed_in = false

[[step]]
click = "Settings"
[[step]]
expect = "Not connected. Bots need an AI account to think."
note = "General opens first, with the AI section"
[[step]]
click = "Connect OpenRouter"
[[step]]
wait_for = "open this link"
note = "The page's fallback link (tests open no browser window)"
[[step]]
follow = "open this link"
[[step]]
wait_for = "Authorize oxbot"
note = "The stand-in OpenRouter's sign-in page"
[[step]]
click = "Authorize oxbot"
[[step]]
wait_for = "Signed in to OpenRouter. You can close this tab."
shot = "signed-in-tab"
[[step]]
open = "/"
[[step]]
click = "Settings"
[[step]]
wait_for = "Connected to OpenRouter · free models first"
[[step]]
expect_js = "!document.getElementById('orSignOut').hidden && document.getElementById('orSignIn').hidden"
note = "Sign out instead of Connect"
[[step]]
expect_js = "/free questions today/.test(document.getElementById('orMonthText').textContent)"
timeout_ms = 5000
note = "The key's limits, read with the new key"
shot = "engines-signed-in"
