name = "Switching a bot to Claude"
about = "The Farm makes a bot (OpenRouter by default), then switches it to Claude in Bot settings: the dialog says it becomes owner-only first, and the badge says Claude after."
covers = ["crates/oxbot/ui/**", "crates/oxbot/src/server.rs", "crates/oxbot-core/src/hub/engines.rs", "crates/oxbot-core/src/hub/access.rs", "crates/oxbot-core/src/bot.rs"]

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Scout" }
[[step]]
click = "Create"
[[step]]
wait_for = "@scout"
[[step]]
expect_js = "document.getElementById('engineBadge').textContent !== 'Claude'"
note = "New bots run on OpenRouter"
[[step]]
send = "hello"
[[step]]
wait_for = "Hello! I'm the stand-in Claude."
note = "The stand-in OpenRouter answers from the same script"
[[step]]
click = "Bot settings"
[[step]]
expect_js = "(() => { const r = document.querySelector('input[name=bdEngine][value=claude]'); r.checked = true; r.dispatchEvent(new Event('change', {bubbles: true})); return true; })()"
note = "Pick Claude (only you)"
[[step]]
expect = "makes it owner-only"
shot = "owner-only-warning"
[[step]]
click = "Save"
[[step]]
expect_js = "document.getElementById('engineBadge').textContent === 'Claude'"
note = "The badge says Claude"
