name = "Searching and filtering need no OK"
about = "A bot clicks search and filters without an approval request; an element oxbot can't name asks; a booking still stops, and on a site the browser isn't signed in to it asks for a sign-in first."
covers = ["crates/oxbot-core/src/policy.rs", "crates/oxbot-core/src/hub/**", "crates/oxbot-browser/src/**"]

[[step]]
click = "Recipes"
[[step]]
send = "search jobs"
[[step]]
wait_for = "Searched the jobs."
note = "The Search button runs at once"
[[step]]
expect_not = "Allow once"
[[step]]
send = "apply filters"
[[step]]
wait_for = "Filtered the results."
note = "So does Apply filters"
[[step]]
expect_not = "Allow once"
[[step]]
send = "click unknown"
[[step]]
wait_for = "Allow once"
note = "An element missing from the snapshot asks: oxbot can't tell what it does"
shot = "unnamed-click-asks"
[[step]]
expect = "element 9_999"
[[step]]
click = "Allow once"
[[step]]
wait_for = "Opened the result."
[[step]]
send = "book it"
[[step]]
wait_for = "Recipes needs you to sign in to example.test before booking"
timeout_ms = 20000
note = "Book now still stops: not signed in to the site, it asks for a sign-in first"
shot = "booking-asks"
[[step]]
click = "Cancel"
[[step]]
wait_for = "didn't book it"
[[step]]
expect = "Not signed in to example.test, so nothing was booked."
