name = "A task on OpenRouter goes on after a restart"
about = "oxbot saves each step of a task; if it stops mid-task (the Mac restarts), it picks the task up from its last saved step when it starts again, without opening the page a second time."
covers = ["crates/oxbot-loop/src/runner.rs", "crates/oxbot-loop/src/store.rs", "crates/oxbot-core/src/store/loop_state.rs", "crates/oxbot-core/src/hub/looped.rs", "crates/oxbot/src/runtime.rs"]

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Scout" }
[[step]]
click = "Create"
[[step]]
wait_for = "@scout"
[[step]]
send = "search slowly"
[[step]]
wait_for = "browser take_snapshot"
note = "Two steps done and saved; the model is slow with the third"
[[step]]
expect_openrouter = '"stalled":true'
[[step]]
restart = true
[[step]]
open = "/"
[[step]]
click = "Scout"
[[step]]
wait_for = "Searched the jobs, after a restart."
timeout_ms = 20000
note = "Picked up and finished"
shot = "resumed"
[[step]]
expect_js = "[...document.querySelectorAll('#log *')].filter(e => e.children.length === 0 && e.textContent.includes('browser navigate_page')).length === 1"
note = "The page wasn't opened again: it went on from the saved step"
