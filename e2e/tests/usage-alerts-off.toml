name = "Usage alerts switched off stay quiet"
about = "With the Settings switch off, passing 50% of a bot's daily AI questions shows no banner and posts no Mac notification, though the level is still noted."
script = "usage-alerts.toml"
covers = ["crates/oxbot-core/src/hub/**", "crates/oxbot-core/src/store/**", "crates/oxbot/src/notify.rs", "crates/oxbot/src/server.rs", "crates/oxbot/ui/**", "crates/oxbot-protocol/**"]

[[step]]
click = "Settings"
[[step]]
expect = "Notifications"
[[step]]
click = "Tell me when AI spending passes"
[[step]]
expect_js = "!document.getElementById('usageAlerts').checked"
shot = "alerts-off"
[[step]]
key = "Escape"
[[step]]
click = "Recipes"
[[step]]
click = "Bot settings"
[[step]]
type = { into = "Questions a day", text = "2" }
[[step]]
click = "Save"
[[step]]
send = "one"
[[step]]
wait_for = "1 question"
timeout_ms = 60000
[[step]]
expect_not = "questions today at"
note = "No banner"
[[step]]
click = "Settings"
[[step]]
expect_js = "document.getElementById('usageAlerts').checked === false"
note = "Still off when Settings opens again"
[[step]]
click = "Activity"
[[step]]
wait_for = "usage passed 50%"
note = "The level is noted, so turning alerts on later brings no late alert"
[[step]]
expect_js = "![...document.querySelectorAll('#logList li')].some(li => li.innerText.includes('Mac notification'))"
note = "No Mac notification"
[[step]]
key = "Escape"
