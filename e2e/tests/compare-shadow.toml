name = "Shadow: the owner's message also runs on another model"
about = "With Shadow on, the owner's message to a bot (on the AI helper) also runs on oxbot's own loop in a test browser; its answer shows under the live reply, and it records the post instead of doing it."
covers = ["crates/oxbot-core/src/hub/compare.rs", "crates/oxbot-core/src/hub/trials.rs", "crates/oxbot-core/src/hub/turns.rs", "crates/oxbot/ui/**"]

[[step]]
click = "Recipes"
[[step]]
wait_for = "⇆ Shadow"
[[step]]
click = "⇆ Shadow"
[[step]]
wait_for = "Shadow your messages"
[[step]]
expect_js = "(() => { const s = document.getElementById('shadowTarget'); const o = [...s.options].find((o) => o.textContent === 'e2e/tool-model:free (classic)'); if (!o) return false; s.value = o.value; return true; })()"
[[step]]
click = "Shadow"
[[step]]
wait_for = "⇆ Shadow on e2e/tool-model:free"
[[step]]
send = "post the nurse job"
[[step]]
wait_for = "Allow once"
[[step]]
click = "Don't allow"
[[step]]
wait_for = "Shadow · e2e/tool-model:free"
timeout_ms = 60000
[[step]]
expect = "acting task: shadow is a dry run"
note = "The shadow recorded the post"
shot = "shadow-card"
[[step]]
expect_site_writes = 2
note = "Only the two the page makes by itself when the live turn's browser opens it; the shadow's test browser blocked its own"
