name = "Files sent to a busy bot go into its task"
about = "A message with a file sent while the bot is still working isn't refused: it shows in the chat with its file, goes into the running task, and the bot reads the file before it answers."
covers = ["crates/oxbot/ui-src/**", "crates/oxbot/src/server.rs", "crates/oxbot-core/src/hub/uploads.rs", "crates/oxbot-core/src/hub/turns.rs"]

[[step]]
click = "Recipes"
[[step]]
send = "take your time"
[[step]]
attach = ["e2e/fixtures/list.csv"]
[[step]]
expect_js = "document.querySelectorAll('#chips .chip[data-state=ready]').length === 1"
[[step]]
send = "and this list"
note = "Enter sends while the bot works"
[[step]]
expect_not = "still working on the last message"
[[step]]
expect_js = "!document.querySelector('#chips .chip') && document.getElementById('input').value === ''"
timeout_ms = 5000
note = "Sent: the chip and the words left the box"
shot = "sent"
[[step]]
wait_for = "list.csv: item,qty,price"
timeout_ms = 20000
note = "The running task read it"
shot = "read"
