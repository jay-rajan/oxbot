name = "Several page steps at once, except where the owner wants fine-grained control"
about = "Several steps at once is on everywhere by default. The owner sets the form site (example.net) to Fine-grained control (Settings → Websites shows it ticked in the one list); there page_steps is refused and the bot does steps one at a time. On the shop, which nobody set, a bot's fill and tick run in a row, it stops at Add to Cart without asking, and the bot asks for that click on its own: the usual approval request."
needs = ["codex"]
covers = ["crates/oxbot-loop/src/tools/steps.rs", "crates/oxbot-loop/src/tools/drive.rs", "crates/oxbot-loop/src/gate.rs", "crates/oxbot-core/src/hub/scripts.rs", "crates/oxbot-core/src/hub/approvals.rs", "crates/oxbot-core/src/policy.rs", "crates/oxbot/src/server.rs", "crates/oxbot/ui-src/**"]
script = "scripts.toml"

[[step]]
click = "Recipes"
[[step]]
expect_js = "(send({ type: 'set_fine_grained_site', site: 'https://forms.example.net/', on: true }), true)"
note = "The owner sets the form site to fine-grained control, as a website row's box does (the test site has no sign-in row to tick)"
[[step]]
click = "Settings"
[[step]]
click = "Websites"
[[step]]
expect_js = "[...document.querySelectorAll('#siteRows .site-row')].some((r) => r.textContent.includes('example.net') && r.textContent.includes('Fine-grained control') && r.querySelector('input[type=checkbox]').checked)"
timeout_ms = 5000
note = "The site shows by its main domain with Fine-grained control ticked, in the one list"
shot = "websites"
[[step]]
key = "Escape"
[[step]]
send = "order two on the form site"
[[step]]
wait_for = "Okay, one step at a time there."
timeout_ms = 60000
[[step]]
expect = "example.net is set to fine-grained control"
note = "Fine-grained: refused, and the bot is told to go one step at a time"
[[step]]
send = "order two frothers"
[[step]]
wait_for = "Allow once"
timeout_ms = 60000
note = "The batch stopped at Add to Cart; the bot asked for it on its own"
[[step]]
expect = "browser fill"
note = "The fill and the tick ran in a row, each a line in the chat"
[[step]]
expect = "Add to Cart"
shot = "card"
[[step]]
expect_openrouter_body = "Ran 2 of 3 steps on shop.example.com"
[[step]]
expect_openrouter_body = "Stopped at step 3 (click 8_4): it needs the person's OK"
[[step]]
click = "Don't allow"
[[step]]
wait_for = "Okay, I didn't add them to the cart."
timeout_ms = 60000
