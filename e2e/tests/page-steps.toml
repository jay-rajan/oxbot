name = "Several page steps at once, except where the owner wants fine-grained control"
about = "Several steps at once is on everywhere by default. The owner sets the form site (example.net) to Fine-grained control (Settings → Websites shows it ticked in the one list); there page_steps is refused and the bot does steps one at a time. On the shop (signed in to), which nobody set, a bot's fill, tick and Add to Cart run in a row: adding to a cart costs nothing, so no approval request."
needs = ["codex"]
covers = ["crates/oxbot-loop/src/tools/steps.rs", "crates/oxbot-loop/src/tools/drive.rs", "crates/oxbot-loop/src/gate.rs", "crates/oxbot-core/src/hub/scripts.rs", "crates/oxbot-core/src/hub/approvals.rs", "crates/oxbot-core/src/policy.rs", "crates/oxbot-core/src/hub/sign_ins.rs", "crates/oxbot/src/server.rs", "crates/oxbot/ui-src/**"]
script = "scripts.toml"

[[step]]
click = "Recipes"
[[step]]
expect_js = "(send({ type: 'set_fine_grained_site', site: 'https://forms.example.net/', on: true }), true)"
note = "The owner sets the form site to fine-grained control, as a website row's box does (the test site has no sign-in row to tick)"
[[step]]
click = "Settings"
[[step]]
click = "Websites"
[[step]]
expect_js = "[...document.querySelectorAll('#siteRows .site-row')].some((r) => r.textContent.includes('example.net') && r.textContent.includes('Fine-grained control') && r.querySelector('input[type=checkbox]').checked)"
timeout_ms = 5000
note = "The site shows by its main domain with Fine-grained control ticked, in the one list"
shot = "websites"
[[step]]
type = { into = "Add a website", text = "http://shop.example.test/" }
note = "Signed in to the shop, so Add to Cart just runs (not signed in, it would wait for a sign-in)"
[[step]]
click = "Sign in"
[[step]]
close_sign_in_window = true
[[step]]
expect_js = "[...document.querySelectorAll('#siteRows .site-row')].some((r) => r.innerText.includes('example.test') && !r.innerText.includes('example.net'))"
timeout_ms = 15000
[[step]]
key = "Escape"
[[step]]
send = "order two on the form site"
[[step]]
wait_for = "Okay, one step at a time there."
timeout_ms = 60000
[[step]]
expect = "example.net is set to fine-grained control"
note = "Fine-grained: refused, and the bot is told to go one step at a time"
[[step]]
send = "order two frothers"
[[step]]
wait_for = "Added two frothers to the cart."
timeout_ms = 60000
note = "The batch ran to the end: adding to a cart costs nothing, so it needs no OK (signed in to the shop)"
[[step]]
expect = "browser fill"
note = "The fill and the tick ran in a row, each a line in the chat"
[[step]]
expect_openrouter_body = "Ran all 3 steps on shop.example.test"
[[step]]
expect_js = "!document.querySelector('#cards .card')"
note = "No approval request"
shot = "batch-ran"
