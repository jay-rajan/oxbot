name = "Settings → AI models and a new bot"
about = "The owner reads where bots' AI calls go in Settings → AI models, sees the AI helper is ready, then makes a bot: it uses free models (the header says so), and its settings offer the AI model and its daily questions. Neither Codex nor the relay is named anywhere."
covers = ["crates/oxbot/ui/**", "crates/oxbot/src/server.rs", "crates/oxbot/src/setup.rs", "crates/oxbot-core/src/hub/engine_prefs.rs", "crates/oxbot-core/src/hub/codex.rs", "crates/oxbot-protocol/**"]
needs = ["codex"]

[[step]]
click = "Settings"
[[step]]
click = "AI models"
[[step]]
expect = "What a task sends goes only to OpenRouter (or a model on this computer), never anywhere else."
shot = "ai-models-tab"
[[step]]
wait_for = "The AI helper (version 0.148"
note = "The AI helper was found"
[[step]]
expect_js = "!/codex|relay|claude/i.test(document.getElementById('setEngines').innerText)"
note = "No engine names, no Claude"
[[step]]
click = "Close"
[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Pantry" }
[[step]]
expect = "Uses free AI models first."
[[step]]
expect_js = "!document.getElementById('nbEngine')"
note = "No engine to pick"
[[step]]
click = "Create"
[[step]]
wait_for = "@pantry"
[[step]]
expect_js = "document.getElementById('engineBadge').textContent === 'Free models'"
[[step]]
click = "Bot settings"
[[step]]
expect_js = "document.getElementById('bdModel').options[0].text === 'Free models (best first)' && document.getElementById('bdModel').value === ''"
note = "The bot's AI model: free models, best first"
[[step]]
expect = "Questions a day"
shot = "bot-ai-model"
