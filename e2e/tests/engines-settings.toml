name = "Settings → General → AI and a new bot"
about = "The owner sees the home's AI account in Settings → General (connected, free models first; the AI helper line shows only when it's broken), then makes a bot: it uses free models (the header says so), nothing to pick when making it, and its settings keep the kind of job under Advanced. Neither Codex nor the relay is named anywhere."
covers = ["crates/oxbot/ui-src/**", "crates/oxbot/src/server.rs", "crates/oxbot/src/setup.rs", "crates/oxbot-core/src/hub/engine_prefs.rs", "crates/oxbot-core/src/hub/codex.rs", "crates/oxbot-protocol/**"]
needs = ["codex"]

[[step]]
click = "Settings"
[[step]]
wait_for = "Connected to OpenRouter · free models first"
shot = "general-ai"
[[step]]
expect_js = "document.getElementById('cxStatus').hidden"
timeout_ms = 10000
note = "The AI helper was found: no problem line"
[[step]]
expect_js = "!/codex|relay|claude/i.test(document.getElementById('setGeneral').innerText)"
note = "No engine names, no Claude"
[[step]]
click = "Close"
[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Pantry" }
[[step]]
expect_js = "!document.getElementById('nbEngine') && !document.getElementById('nbKind')"
note = "No engine or kind to pick"
[[step]]
expect_not = "Uses free AI models first."
[[step]]
click = "Create"
[[step]]
expect_js = "document.getElementById('botStatus').dataset.bot === 'pantry'"
timeout_ms = 5000
[[step]]
expect_js = "!document.getElementById('engineBadge')"
[[step]]
click = "Bot settings"
[[step]]
expect_js = "document.getElementById('bdKind').options[0].text === 'Automatic' && document.getElementById('bdKind').value === '' && !document.getElementById('bdModelList') && !document.getElementById('bdDaily')"
note = "Automatic, under Advanced; no model list or daily questions field"
[[step]]
expect_not = "Questions a day"
shot = "bot-settings"
