name = "Always allow a click"
about = "Always allow on a Save approval request lets the same click through next time with a quiet line; Pay now never offers it. Bot settings no longer lists the rules (permissions were taken out of the window for now, Nov 8); the rule still applies, and removing one comes back with the Permissions section."
covers = ["crates/oxbot-core/src/hub/rules.rs", "crates/oxbot-core/src/hub/approvals.rs", "crates/oxbot-core/src/store/rules.rs", "crates/oxbot-core/src/policy.rs", "crates/oxbot/src/server.rs", "crates/oxbot/ui-src/**", "crates/oxbot-protocol/**", "crates/oxbot-browser/src/**"]

[[step]]
click = "Recipes"
[[step]]
send = "save it"
[[step]]
wait_for = "Always allow"
note = "A Save approval request offers Always allow, with what it means"
[[step]]
expect = "Always lets Recipes click button \"Save\" on jobs.example.com without asking."
shot = "card-offers-always"
[[step]]
click = "Always allow"
[[step]]
wait_for = "Saved."
[[step]]
expect = "You always allowed: click button \"Save\" on jobs.example.com"
[[step]]
send = "save it again"
[[step]]
expect_js = "[...document.querySelectorAll('.tool')].some(e => e.textContent === 'always allowed: click button \"Save\" on jobs.example.com')"
timeout_ms = 10000
note = "The same click runs with no approval request, and says why (a line of its own, not the earlier answer)"
shot = "allowed-by-rule"
[[step]]
expect_js = "!document.querySelector('#cards .card')"
[[step]]
click = "Bot settings"
[[step]]
expect_not = "Always allowed"
note = "No permissions list in Bot settings for now"
shot = "no-rules-in-settings"
[[step]]
click = "Cancel"
[[step]]
send = "pay it"
[[step]]
wait_for = "Allow once"
note = "Paying never offers Always"
[[step]]
expect = "Pay now"
[[step]]
expect_js = "![...document.querySelectorAll('#cards button')].some(b => b.textContent === 'Always allow')"
shot = "pay-no-always"
[[step]]
click = "Don't allow"
[[step]]
wait_for = "didn't pay"
