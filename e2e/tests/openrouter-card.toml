name = "A bot on OpenRouter asks before posting"
about = "oxbot's own loop checks every tool first, with the same rules as Claude: clicking Post shows the red card; Allow once posts, and Deny tells the model it didn't."
covers = ["crates/oxbot-loop/src/gate.rs", "crates/oxbot-loop/src/runner.rs", "crates/oxbot-core/src/hub/**", "crates/oxbot-core/src/policy.rs", "crates/oxbot/ui/**"]

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Scout" }
[[step]]
click = "Create"
[[step]]
wait_for = "@scout"
[[step]]
send = "post it"
[[step]]
wait_for = "Allow once"
note = "The card, before the click"
[[step]]
expect = "Post"
shot = "card"
[[step]]
click = "Allow once"
[[step]]
wait_for = "Posted."
[[step]]
expect = "You allowed"
[[step]]
send = "post it again"
[[step]]
wait_for = "Allow once"
[[step]]
click = "Deny"
[[step]]
wait_for = "Okay, I didn't post it."
note = "The model was told oxbot said no"
shot = "denied"
