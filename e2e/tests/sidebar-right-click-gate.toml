name = "Right-click on a device: the same rules as ···"
about = "Sam (on a device) can only file Jay's shared bot (into a section of Sam's own); renaming and deleting show only on Sam's own bot, exactly where ··· offers them (elsewhere ··· only lists reports). Only the owner has private bots, so Sam's own bot (made here: the seed's Bank was handed to the owner) has no Make private."
covers = ["crates/oxbot/ui-src/**", "crates/oxbot-core/src/hub/**", "crates/oxbot/src/server.rs"]
as = "Sam"

[[step]]
right_click = "Recipes by Jay"
[[step]]
expect = "Move to section"
[[step]]
expect_not = "Rename…"
[[step]]
expect_not = "Delete…"
[[step]]
expect_not = "Make private"
shot = "not-mine"
[[step]]
key = "Escape"
[[step]]
expect_js = "document.getElementById('botMenu').hidden"
[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Garden" }
[[step]]
click = "Create"
[[step]]
expect_js = "document.getElementById('botStatus').dataset.bot === 'garden'"
timeout_ms = 5000
note = "Sam's own bot, shared with everyone"
[[step]]
right_click = "Garden by Sam"
[[step]]
expect = "Rename…"
[[step]]
expect = "Delete…"
[[step]]
expect_js = "!document.getElementById('botMenu').innerText.includes('Make private') && !document.getElementById('botMenu').innerText.includes('Make shared')"
note = "Only the owner can have private bots: no privacy item for Sam"
shot = "mine"
[[step]]
key = "Escape"
[[step]]
click = "Recipes by Jay"
[[step]]
expect_js = "!document.getElementById('botMore').hidden && document.getElementById('botMore').getAttribute('aria-label') === 'Reports'"
note = "On Jay's bot ··· only lists its reports (#14): no rename, privacy or delete, the same rule"
[[step]]
click = "Reports"
[[step]]
expect_js = "document.getElementById('botDlg').open && document.getElementById('bdManage').hidden && document.getElementById('bdDelete').hidden"
[[step]]
click = "Close"
[[step]]
click = "Garden by Sam"
[[step]]
expect_js = "!document.getElementById('botMore').hidden && document.getElementById('botMore').getAttribute('aria-label') === 'Bot settings'"
[[step]]
right_click = "Recipes by Jay"
[[step]]
click = "Move to section"
[[step]]
click = "New section…"
[[step]]
type = { into = "Name", text = "Mine" }
[[step]]
key = "Enter"
[[step]]
expect_js = "(() => { const g = document.querySelector('.group[data-key^=\"s:\"]'); return !!g && g.innerText.includes('Mine') && g.innerText.includes('Recipes'); })()"
note = "Sam files Jay's bot in a section of Sam's own; the bot itself doesn't change"
