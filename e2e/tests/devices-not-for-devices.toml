name = "A device can't connect other devices"
about = "Someone on a device (Ann) has no Connect a device button, no Devices tab and no Add a device in Settings → People: only the home computer pairs phones. Their bottom row is Settings and Websites."
covers = ["crates/oxbot/ui-src/**", "crates/oxbot/src/server.rs", "crates/oxbot/src/door/**"]
as = "Ann"

[[step]]
expect_js = "document.getElementById('deviceBtn').hidden"
note = "No Connect a device button"
[[step]]
click = "Settings"
[[step]]
expect = "Tell me when AI use passes 50% and 80% of a limit"
note = "The Notifications section (its heading shows in capitals)"
[[step]]
expect_js = "![...document.querySelectorAll('#appDlg [role=tab]')].some((t) => /^Devices$/.test(t.textContent.trim()))"
note = "No Devices tab"
[[step]]
click = "People"
[[step]]
expect_js = "document.getElementById('addDeviceRow').hidden && document.getElementById('pairForm').hidden"
note = "No Add a device"
[[step]]
expect_js = "![...document.querySelectorAll('#peopleRows button')].some((b) => b.textContent === 'Devices')"
note = "No one's device list to manage"
shot = "people-on-device"
[[step]]
key = "Escape"
[[step]]
expect_js = "[...document.querySelectorAll('.side-foot > button')].filter((b) => !b.hidden).map((b) => b.id).join() === 'settingsBtn,signedInBtn'"
note = "Two items: Settings and Websites"
[[step]]
click = "Websites"
[[step]]
expect_js = "document.querySelector('[data-tab=\"setSignins\"]').getAttribute('aria-selected') === 'true'"
[[step]]
key = "Escape"
