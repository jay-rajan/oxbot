name = "Private bots may use free models: personal details are removed first"
about = "A shared bot's requests go to OpenRouter with its defaults. A private bot's do too, since personal details are always removed first, so free models work."
covers = ["crates/oxbot-loop/src/runner.rs", "crates/oxbot-loop/src/router.rs", "crates/oxbot-llm/src/openrouter.rs", "crates/oxbot-core/src/hub/looped.rs", "crates/oxbot-core/src/hub/**"]

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Scout" }
[[step]]
click = "Create"
[[step]]
expect_js = "document.getElementById('botStatus').dataset.bot === 'scout'"
timeout_ms = 5000
[[step]]
send = "hello"
[[step]]
wait_for = "Hello! I'm the stand-in bot."
[[step]]
expect_openrouter_not = "data_collection"
note = "A shared bot: OpenRouter's defaults"
[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Diary" }
[[step]]
click = "Private: only you"
[[step]]
click = "Create"
[[step]]
expect_js = "document.getElementById('botStatus').dataset.bot === 'diary' && document.getElementById('botStatus').textContent.startsWith('private')"
timeout_ms = 10000
[[step]]
send = "hello"
[[step]]
wait_for = "Hello! I'm the stand-in bot."
[[step]]
expect_openrouter_not = "data_collection"
note = "Personal details are always removed first: the private bot may use free models"
