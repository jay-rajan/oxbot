name = "A device can't connect other devices"
about = "Someone on a device (Ann) has no Connect a device button and no Devices tab in Settings: only the home computer pairs phones. Their bottom row is Settings and Websites."
covers = ["crates/oxbot/ui/**", "crates/oxbot/src/server.rs", "crates/oxbot/src/door/**"]
as = "Ann"

[[step]]
expect_js = "document.getElementById('gateBtn').hidden"
note = "No Connect a device button"
[[step]]
click = "Settings"
[[step]]
expect = "Notifications"
[[step]]
expect_js = "document.getElementById('gatesTab').hidden"
note = "No Devices tab"
[[step]]
key = "Escape"
[[step]]
expect_js = "[...document.querySelectorAll('.side-foot > button')].filter((b) => !b.hidden).map((b) => b.id).join() === 'settingsBtn,signedInBtn'"
note = "Two items: Settings and Websites"
[[step]]
click = "Websites"
[[step]]
expect_js = "document.querySelector('[data-tab=\"setSignins\"]').getAttribute('aria-selected') === 'true'"
[[step]]
key = "Escape"
