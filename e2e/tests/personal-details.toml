name = "Personal details leave as stand-ins and come back real"
about = "A private bot is told an email and the owner's name. What reaches OpenRouter has stand-ins ([email 1], [person 1]) and never the real values, and asks no provider to refuse keeping data (so free models work); the answer in the chat has the real email and name back."
needs = ["codex"]
covers = ["crates/oxbot-relay/**", "crates/oxbot-loop/src/gateway.rs", "crates/oxbot-loop/src/runner.rs", "crates/oxbot-loop/src/lib.rs", "crates/oxbot-core/src/store/codex.rs", "crates/oxbot-core/src/hub/codex.rs", "crates/oxbot-core/src/hub/looped.rs", "crates/oxbot-llm/src/openrouter.rs", "crates/oxbot-protocol/**", "crates/oxbot/ui-src/**"]

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Diary" }
[[step]]
click = "Private: only you"
[[step]]
click = "Create"
[[step]]
expect_js = "document.getElementById('botStatus').dataset.bot === 'diary' && document.getElementById('botStatus').textContent.startsWith('private')"
timeout_ms = 10000
[[step]]
send = "remember my contact: ann.lee@example.com, ask Jay"
[[step]]
wait_for = "Noted, remember my contact: ann.lee@example.com, ask Jay"
timeout_ms = 60000
note = "The model saw stand-ins; the chat shows the real email and name"
shot = "answer"
[[step]]
expect_openrouter_body = "remember my contact: [email 1], ask [person 1]"
note = "What left the home computer: stand-ins for the email and the owner's name"
[[step]]
expect_openrouter_not = "ann.lee@example.com"
note = "The real email never reached OpenRouter"
[[step]]
expect_openrouter_not = "ask Jay"
[[step]]
expect_openrouter_not = "data_collection"
note = "With details removed, the private bot may use free models' providers"
[[step]]
expect_db = { query = "SELECT COUNT(*) >= 1 FROM relay_log WHERE bot = 'diary'", equals = "1" }
note = "What was sent is kept (with stand-ins)"
