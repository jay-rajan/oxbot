name = "A website signed in lands in the one list"
about = "Settings → Websites has no Add a website box (bots ask to sign in when they need to). A sign-in goes to the home browser, and the site lands in the one list as a home row with its actions on the row (Fine-grained control, Open, Sign out). Sam's own sign-ins never show for Jay."
covers = ["crates/oxbot/ui-src/**", "crates/oxbot-core/src/hub.rs", "crates/oxbot-core/src/store.rs", "crates/oxbot-browser/**", "crates/oxbot/src/server.rs"]

[[step]]
click = "Settings"
[[step]]
click = "Websites"
[[step]]
expect = "wikipedia.org"
[[step]]
expect_not = "Only for my private bots"
note = "No picker: the home browser, always"
[[step]]
expect_js = "(() => { const q = new URLSearchParams(location.search).get('as'); const k = sessionStorage.getItem('oxbotHomeComputerKey'); const w = new WebSocket(`ws://${location.host}/ws?${q ? 'as=' + encodeURIComponent(q) : 'k=' + k}`); w.onopen = () => { w.send(JSON.stringify({ type: 'add_sign_in', url: location.origin + '/' })); setTimeout(() => w.close(), 3000); }; return true; })()"
note = "Signs in to a local page (oxbot's own), never a real site, as a bot's sign-in request would"
[[step]]
close_sign_in_window = true
note = "As a person would after signing in (once the window is open)"
[[step]]
expect_js = "[...document.querySelectorAll('#siteRows .site-row')].some((r) => r.innerText.includes('127.0.0.1') && r.innerText.includes('Shared bots') && !r.classList.contains('private'))"
timeout_ms = 15000
note = "Waits for the site's row: a home row, for shared bots"
[[step]]
expect_js = "(() => { const r = [...document.querySelectorAll('#siteRows .site-row')].find((r) => r.innerText.includes('127.0.0.1')); const b = [...r.querySelectorAll('button')].map((b) => b.textContent); return b.includes('Open') && b.includes('Sign out') && !!r.querySelector('input[type=checkbox]'); })()"
note = "Its actions are on the row"
shot = "websites"
[[step]]
expect_not = "bank.example"
note = "Sam's sign-ins never show for Jay"
