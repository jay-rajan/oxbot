name = "A bot shared with others is locked to you"
about = "Ann isn't one of the people Jay shared Journal with: she sees it by name with a lock, and nothing of its chat or who it's shared with."
covers = ["crates/oxbot/ui/**", "crates/oxbot-core/src/bot.rs", "crates/oxbot-core/src/hub/access.rs", "crates/oxbot/src/server.rs"]
as = "Ann"

[[step]]
click = "Journal"
[[step]]
expect = "Only Jay and the people they shared it with can open it."
[[step]]
expect_not = "shared with Sam"
[[step]]
expect_js = "!JSON.stringify(bots.get('journal').info).includes('Sam')"
note = "Who it's shared with isn't sent to her"
