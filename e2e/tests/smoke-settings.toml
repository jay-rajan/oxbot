name = "Settings opens on each tab"
about = "The gear opens Settings; General, Websites, People, Schedules and Activity each show their content."
smoke = true
covers = []

[[step]]
click = "Settings"
[[step]]
expect = "Tell me when AI use passes 50% and 80% of a limit"
note = "The Notifications section (its heading shows in capitals)"
[[step]]
click = "Websites"
[[step]]
expect = "wikipedia.org"
note = "The home sign-in from the seed"
[[step]]
click = "People"
[[step]]
expect = "Add a device"
[[step]]
click = "Schedules"
[[step]]
expect = "No schedules yet. Ask a bot"
note = "The seed has no schedules"
[[step]]
click = "Activity"
[[step]]
expect = "What left the home computer"
[[step]]
click = "oxbot's own log"
[[step]]
expect_js = "document.querySelector('#setActivity details.oxlog').open"
[[step]]
key = "Escape"
