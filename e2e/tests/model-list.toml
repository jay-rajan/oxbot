name = "A bot's own models, in order; Kind of job in Advanced"
about = "A bot given its own list of two free models (the backup first; there's no list editor any more, so the test sends the list as the page would) asks them in that order, its header names the first, and its settings show Advanced → Kind of job as \"Its own list of models\". Switching it back to Automatic and saving clears the list."
covers = ["crates/oxbot-loop/src/router.rs", "crates/oxbot-core/src/model_lists.rs", "crates/oxbot-core/src/hub/engines.rs", "crates/oxbot-core/src/hub/session.rs", "crates/oxbot-core/src/bot.rs", "crates/oxbot-protocol/**", "crates/oxbot/ui/**", "crates/oxbot/src/server.rs"]

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Scout" }
[[step]]
expect_js = "!document.getElementById('nbKind')"
note = "No kind to pick when making a bot: the server picks from the instructions"
[[step]]
click = "Create"
[[step]]
expect_js = "document.getElementById('botStatus').dataset.bot === 'scout'"
timeout_ms = 5000
[[step]]
click = "Bot settings"
[[step]]
expect_js = "(() => { const a = document.getElementById('bdAdvanced'); const k = document.getElementById('bdKind'); return !a.hidden && !a.open && a.contains(k) && k.options[0].text === 'Automatic' && k.value === ''; })()"
note = "Advanced is closed and holds Kind of job, on Automatic"
[[step]]
click = "Advanced"
[[step]]
expect = "Kind of job"
shot = "advanced-automatic"
[[step]]
click = "Cancel"
[[step]]
expect_js = "(send({ type: 'set_engine', bot: 'scout', engine: bots.get('scout').info.engine, models: ['e2e/backup:free', 'e2e/tool-model:free'] }), true)"
note = "Its own list: the backup, then the tool model"
[[step]]
expect_js = "!document.getElementById('engineBadge')"
timeout_ms = 5000
note = "No model pill in the header"
[[step]]
send = "hello"
[[step]]
wait_for = "1 question"
[[step]]
expect_openrouter = '"models":["e2e/backup:free","e2e/tool-model:free"]'
note = "Asked in the bot's order"
[[step]]
click = "Bot settings"
[[step]]
click = "Advanced"
[[step]]
expect_js = "(() => { const k = document.getElementById('bdKind'); return k.value === 'own' && k.selectedOptions[0].text === 'Its own list of models'; })()"
note = "The settings keep the list"
shot = "models-kept"
[[step]]
expect_js = "(() => { const k = document.getElementById('bdKind'); k.value = ''; k.dispatchEvent(new Event('change')); return k.value === ''; })()"
note = "Back to Automatic"
[[step]]
click = "Save"
[[step]]
expect_js = "!document.getElementById('engineBadge')"
timeout_ms = 5000
note = "Still no model pill"
