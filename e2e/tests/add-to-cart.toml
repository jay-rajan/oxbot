name = "Adding to a cart needs no OK"
about = "Signed in to the shop first (Settings → Websites), a bot adds to the cart with no approval request: the owner gives only what costs money to the person (buying, ordering, checking out, booking). Not signed in, it would wait for a sign-in instead (see cart-needs-sign-in)."
covers = ["crates/oxbot-core/src/policy.rs", "crates/oxbot-core/src/hub/approvals.rs", "crates/oxbot-core/src/hub/sign_ins.rs", "crates/oxbot/ui-src/**"]

[[step]]
click = "Settings"
[[step]]
click = "Websites"
[[step]]
type = { into = "Add a website", text = "http://shop.example.test/" }
note = "The test shop, whose home page sets a sign-in cookie"
[[step]]
click = "Sign in"
[[step]]
close_sign_in_window = true
[[step]]
expect_js = "[...document.querySelectorAll('#siteRows .site-row')].some((r) => r.innerText.includes('example.test'))"
timeout_ms = 15000
note = "Signed in to the shop"
[[step]]
key = "Escape"
[[step]]
click = "Recipes"
[[step]]
send = "add the frother to the cart"
[[step]]
wait_for = "Added the frother to the cart."
timeout_ms = 20000
note = "Signed in to the shop: the click runs, with no approval request"
shot = "add-to-cart"
[[step]]
expect_js = "!document.querySelector('#cards .card')"
note = "No approval request: a cart costs nothing until the order"
[[step]]
expect_not = "needs you to sign in"
