name = "No microphone without on-device dictation"
about = "Where the Mac can't dictate on-device, there's no microphone button at all, and Settings → General says why and how to turn it on."
covers = ["crates/oxbot/ui-src/**", "crates/oxbot/src/server.rs", "crates/oxbot/src/dictation.rs", "crates/oxbot/src/runtime.rs", "crates/oxbot-protocol/**", "crates/oxbot-e2e/**", "mac/**"]

[[step]]
click = "Recipes"
[[step]]
expect_js = "document.getElementById('mic').hidden"
note = "No mic: this Mac can't dictate on-device"
shot = "no-mic"
[[step]]
click = "Settings"
[[step]]
expect_js = "!document.getElementById('setupSection').hidden && document.getElementById('setupLine').textContent.startsWith('Optional') && document.getElementById('setupList').textContent.includes('No microphone')"
note = "Settings → General says why there's no microphone (optional, not turned on)"
