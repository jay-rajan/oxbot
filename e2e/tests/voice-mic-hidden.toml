name = "No microphone without on-device dictation"
about = "Where the Mac can't dictate on-device, there's no microphone button at all (Settings lists only setup problems; dictation is optional, so it isn't one)."
covers = ["crates/oxbot/ui/**", "crates/oxbot/src/server.rs", "crates/oxbot/src/dictation.rs", "crates/oxbot/src/runtime.rs", "crates/oxbot-protocol/**", "crates/oxbot-e2e/**", "mac/**"]

[[step]]
click = "Recipes"
[[step]]
expect_js = "document.getElementById('mic').hidden"
note = "No mic: this Mac can't dictate on-device"
shot = "no-mic"
[[step]]
click = "Settings"
[[step]]
expect_js = "document.getElementById('setupSection').hidden"
note = "Dictation is optional: Settings → General lists only setup problems, so it no longer says why there's no mic (owner to confirm)"
