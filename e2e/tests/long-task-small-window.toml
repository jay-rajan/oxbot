name = "A long task fits a 64k model"
about = "A bot on OpenRouter reads eight big pages on a model with a 64k window: old pages become one-line stubs, then its notes are summarized into a task state (the chat shows it tidying up), it reads the first page back by its handle, and no request ever goes over the window."
covers = ["crates/oxbot-loop/**", "crates/oxbot-core/src/hub/looped.rs", "crates/oxbot-core/src/prompt.rs", "crates/oxbot-core/src/store/loop_state.rs", "crates/oxbot-e2e/src/fake_openrouter.rs", "crates/oxbot-e2e/src/pages.rs"]
script = "context.toml"
openrouter_context = "e2e/tool-model:free=64000"

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Scout" }
[[step]]
click = "Create"
[[step]]
wait_for = "@scout"
[[step]]
send = "compare all the lamps"
[[step]]
wait_for = "Tidying up its notes"
timeout_ms = 120000
note = "Near the window's limit it summarizes what it did so far"
shot = "tidying"
[[step]]
wait_for = "Compared the lamps on all eight pages."
timeout_ms = 120000
shot = "answered"
[[step]]
expect_openrouter_body = "[cleared r1: take_snapshot"
note = "An old page became a stub naming its handle"
[[step]]
expect_openrouter = '"helper":"compact"'
[[step]]
expect_openrouter_body = "You are compressing an agent's working memory"
note = "The summary used the fixed prompt"
[[step]]
expect_openrouter = '"called":"mcp__oxbot__read_result"'
[[step]]
expect_openrouter_body = '<stored_result handle=\"r1\">'
note = "The first page came back by its handle"
[[step]]
expect_openrouter_not = "maximum context length"
note = "No request went over the 64k window"
