name = "Pairing a phone (devices)"
about = "On the home computer, the QR button next to the gear opens Settings → People with the Add a device form and your name filled in. Show pairing code lets phones use the network the Mac is on (no Wi-Fi list to manage), then shows a QR code and a one-time code and the door opens; Cancel hides it. Someone on a device sees neither the button nor the form."
covers = ["crates/oxbot/ui-src/**", "crates/oxbot/src/door/**", "crates/oxbot/src/server.rs", "crates/oxbot-protocol/**", "crates/oxbot-gate/**"]

[[step]]
click = "Connect a device"
note = "The QR button next to the gear"
[[step]]
expect_js = "document.querySelector('[data-tab=\"setPeople\"]').getAttribute('aria-selected') === 'true' && !document.getElementById('pairForm').hidden"
note = "Settings → People, with the Add a device form open"
[[step]]
expect = "A device is a phone, tablet or laptop"
[[step]]
expect_js = "document.getElementById('pairPerson').value === 'Jay'"
note = "Your own name is filled in"
[[step]]
expect_js = "document.querySelector('#peopleRows').innerText.includes('this Mac')"
note = "The owner's row: this Mac, no paired devices yet"
[[step]]
expect_not = "Networks phones can use"
note = "The Wi-Fi networks list is hidden"
shot = "add-device"
[[step]]
click = "Show pairing code"
[[step]]
wait_for = "Works once"
shot = "pairing-code"
[[step]]
expect_js = "!!door && door.networks.some((n) => door.current && n.id === door.current.id)"
note = "The network the Mac is on was added for phones"
[[step]]
expect_js = "!!document.querySelector('#pairQr svg') && /^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(document.getElementById('pairCode').textContent)"
note = "A QR code and a code like K7QM-R3XP"
[[step]]
click = "Cancel"
[[step]]
expect_js = "document.getElementById('pairBox').hidden && !document.getElementById('addDeviceRow').hidden"
note = "Back to Add a device"
[[step]]
key = "Escape"
