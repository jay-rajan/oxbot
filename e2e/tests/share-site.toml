name = "Only the owner has private sign-ins"
about = "Only the owner of the home computer has a browser of their own, so on Sam's device Settings → Websites shows the home's sites only: Sam's old sign-in (bank.example, in his own browser in the seed) stays on disk but isn't listed, and there's no Share with the home or Sign out of all your private sites. The home browser's sites have no Open or Sign out off the home computer. Asking the home computer anyway (sharing or signing out his own sites) gets a plain refusal. (Before, Sam's own sign-in showed as a private row he could share with the home.)"
covers = ["crates/oxbot/ui-src/**", "crates/oxbot-core/src/hub/sign_ins.rs", "crates/oxbot-core/src/hub/browsers.rs", "crates/oxbot/src/server.rs", "crates/oxbot-protocol/**"]
as = "Sam"

[[step]]
click = "Settings"
[[step]]
click = "Websites"
[[step]]
expect = "wikipedia.org"
timeout_ms = 5000
note = "The home's sites are listed"
[[step]]
expect_not = "bank.example"
note = "Sam's own sign-in isn't: only the owner has private sign-ins"
[[step]]
expect_js = "!document.querySelector('#siteRows .site-row.private') && ![...document.querySelectorAll('#siteRows button')].some((b) => b.textContent === 'Share with the home')"
note = "No private rows and no Share with the home"
[[step]]
expect_js = "document.getElementById('signOutMine').hidden && document.getElementById('signOutAll').hidden && [...document.querySelectorAll('#siteRows .site-row button')].every((b) => !/Sign out|Open/.test(b.textContent))"
note = "No Sign out of all your private sites; the home browser's sites can't be opened or signed out from another device"
[[step]]
expect = "Bots use the home browser and the websites the home is signed in to."
shot = "home-only"
[[step]]
expect_js = "(send({ type: 'share_site', site: 'bank.example' }), true)"
note = "Ask the home computer to share his old sign-in anyway"
[[step]]
expect_js = "(() => { const t = document.getElementById('toast'); return !t.hidden && t.textContent.startsWith('Only the owner of the home computer has private sign-ins.'); })()"
timeout_ms = 10000
note = "A plain refusal"
shot = "refused"
[[step]]
expect_js = "(send({ type: 'sign_out_all', mine: true }), true)"
note = "…or to sign his own browser out of everything"
[[step]]
expect_js = "(() => { const t = document.getElementById('toast'); return !t.hidden && t.textContent.startsWith('Only the owner of the home computer has private sign-ins.'); })()"
timeout_ms = 10000
[[step]]
expect_not = "bank.example"
note = "Nothing changed: still not listed"
