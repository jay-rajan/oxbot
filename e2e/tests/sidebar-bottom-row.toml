name = "Sidebar bottom row: Settings, Connect a device, Websites"
about = "The bottom of the sidebar shows the gear, Connect a device and a Websites link to Settings → Websites (the websites the bots are signed in to); the old signed-in list is gone."
covers = ["crates/oxbot/ui-src/**"]

[[step]]
expect_js = "[...document.querySelectorAll('.side-foot > button')].filter((b) => !b.hidden).map((b) => b.id).join() === 'settingsBtn,gateBtn,signedInBtn'"
note = "Three items, in order"
shot = "bottom-row"
[[step]]
expect_js = "!document.getElementById('sites') && !document.querySelector('.side .sites')"
note = "No signed-in list in the sidebar"
[[step]]
expect_js = "document.getElementById('signedInCount').textContent === '1' && !document.getElementById('signedInCount').hidden"
note = "It counts your sites: home's one"
[[step]]
click = "Websites"
[[step]]
expect_js = "document.querySelector('[data-tab=\"setSignins\"]').getAttribute('aria-selected') === 'true' && !document.getElementById('setSignins').hidden"
note = "Settings opens on Websites"
[[step]]
expect = "wikipedia.org"
shot = "sign-ins"
[[step]]
key = "Escape"
[[step]]
click = "Connect a device"
[[step]]
expect = "A device is a phone, tablet or laptop"
[[step]]
key = "Escape"
