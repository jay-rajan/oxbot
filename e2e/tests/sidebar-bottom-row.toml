name = "Sidebar bottom row: Settings and People"
about = "The bottom of the sidebar shows the gear and People; no websites button (websites are in Settings → Websites) and no signed-in list."
covers = ["crates/oxbot/ui-src/**"]

[[step]]
expect_js = "[...document.querySelectorAll('.side-foot > button')].filter((b) => !b.hidden).map((b) => b.id).join() === 'settingsBtn,deviceBtn'"
note = "Two items, in order"
shot = "bottom-row"
[[step]]
expect_js = "!document.getElementById('sites') && !document.querySelector('.side .sites')"
note = "No signed-in list in the sidebar"
[[step]]
click = "Connect a device"
[[step]]
expect = "A device is a phone, tablet or laptop"
[[step]]
key = "Escape"
