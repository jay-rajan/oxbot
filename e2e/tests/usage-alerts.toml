name = "Usage alerts at 50% and 80%, once each"
about = "A bot allowed 5 AI questions a day passes 50% and then 80% of them: a banner and one Mac notification for each level, never two; the banner survives a reload and can be dismissed."
script = "usage-alerts.toml"
covers = ["crates/oxbot-core/src/hub/**", "crates/oxbot-core/src/store/**", "crates/oxbot/src/notify.rs", "crates/oxbot/src/server.rs", "crates/oxbot/ui/**", "crates/oxbot-protocol/**"]

[[step]]
click = "Recipes"
[[step]]
click = "Bot settings"
[[step]]
type = { into = "Questions a day", text = "5" }
[[step]]
click = "Save"
[[step]]
send = "one"
[[step]]
wait_for = "1 question"
[[step]]
send = "two"
[[step]]
expect_js = "document.querySelectorAll('#log .meter').length === 2"
timeout_ms = 60000
[[step]]
expect_js = "document.getElementById('usageAlert').hidden"
note = "40%: no banner yet"
[[step]]
send = "three"
[[step]]
wait_for = "Recipes's questions today at 60%"
timeout_ms = 60000
note = "The banner, under the header"
shot = "banner-50"
[[step]]
send = "four"
[[step]]
wait_for = "Recipes's questions today at 80%"
timeout_ms = 60000
shot = "banner-80"
[[step]]
expect_js = "document.querySelectorAll('#usageAlert').length === 1"
note = "One banner, showing the highest level"
[[step]]
click = "Settings"
[[step]]
click = "Activity"
[[step]]
expect = "Mac notification"
[[step]]
expect_js = "[...document.querySelectorAll('#logList li')].filter(li => li.innerText.includes('Mac notification')).length === 2"
note = "Exactly two notifications: one at 50%, one at 80%"
shot = "notifications-logged"
[[step]]
key = "Escape"
[[step]]
open = "/"
[[step]]
wait_for = "Recipes's questions today at 80%"
note = "Still there after a reload"
[[step]]
click = "Dismiss"
[[step]]
expect_js = "document.getElementById('usageAlert').hidden"
note = "Dismissed on this page"
