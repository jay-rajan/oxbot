name = "Assistant makes a bot after your OK"
about = "Asking the Assistant for a bot shows an approval request; pressing Create makes it, by whoever asked."
covers = ["crates/oxbot-core/src/hub.rs", "crates/oxbot-core/src/tools.rs", "crates/oxbot-core/src/policy.rs", "crates/oxbot/ui/**"]

[[step]]
click = "Assistant"
[[step]]
send = "make a bot for the weather"
[[step]]
wait_for = "Don't create"
[[step]]
expect = "Weather Notes"
[[step]]
expect_js = "![...document.querySelectorAll('#cards button')].some(b => b.textContent === 'Always allow')"
note = "The Assistant's approval requests never offer Always allow"
[[step]]
click = "Create"
[[step]]
wait_for = "Created it."
[[step]]
expect_js = "[...document.querySelectorAll('.bot-item')].some(b => b.innerText.includes('Weather Notes') && b.innerText.includes('by Jay'))"
note = "In the sidebar, made by Jay"
