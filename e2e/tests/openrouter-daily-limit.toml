name = "A bot's daily limit on OpenRouter"
about = "With a limit of 2 model requests a day in its settings, a bot answers twice, then says plainly it has used them, sends nothing more to OpenRouter, and the usage banner shows."
covers = ["crates/oxbot-core/src/hub/looped.rs", "crates/oxbot-core/src/hub/alerts.rs", "crates/oxbot-loop/src/meter.rs", "crates/oxbot-core/src/store/**", "crates/oxbot/ui/**", "crates/oxbot/src/server.rs"]

[[step]]
click = "New bot"
[[step]]
type = { into = "Name", text = "Scout" }
[[step]]
click = "Create"
[[step]]
wait_for = "@scout"
[[step]]
click = "Bot settings"
[[step]]
type = { into = "Questions a day", text = "2" }
[[step]]
click = "Save"
[[step]]
send = "hello"
[[step]]
wait_for = "1 question"
[[step]]
send = "hello again"
[[step]]
wait_for = "Hello! I'm the stand-in bot."
[[step]]
expect_js = "[...document.querySelectorAll('#log *')].filter(e => e.children.length === 0 && e.textContent.includes(\"Hello! I'm the stand-in bot.\")).length === 2"
note = "Two answers"
[[step]]
send = "and once more"
[[step]]
wait_for = "Scout has used its 2 AI questions for today."
note = "The third is stopped, and says why"
[[step]]
expect = "the owner can raise the limit (Settings → General)"
[[step]]
expect = "Scout's questions today at 100%"
note = "The usage banner names the bot's limit"
shot = "limit-reached"
[[step]]
expect_js = "!document.getElementById('usageAlertText').innerText.includes('Claude')"
note = "…and nothing about Claude's plan"
[[step]]
expect_openrouter_not = "and once more"
note = "Nothing was sent the third time"
