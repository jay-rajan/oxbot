name = "A short video becomes still frames"
about = "Bots can't watch video: oxbot takes evenly spaced still frames on the Mac (one a second for a short clip), says so on the chip and in the chat, and the bot reads the frames."
covers = ["crates/oxbot/ui-src/**", "crates/oxbot/src/server.rs", "crates/oxbot-core/src/attach/**", "crates/oxbot-core/src/hub/uploads.rs", "crates/oxbot-core/src/hub/turns.rs", "crates/oxbot-protocol/**", "crates/oxbot-e2e/**", "e2e/fixtures/**"]

[[step]]
click = "Recipes"
[[step]]
attach = ["e2e/fixtures/clip.mov"]
[[step]]
wait_for = "3 still frames from 3 s"
timeout_ms = 20000
note = "The chip says what oxbot made of it"
shot = "video-chip"
[[step]]
send = "what happens in this clip?"
[[step]]
wait_for = "3 frames of"
note = "The bot got the frames"
[[step]]
expect = "can't watch video"
note = "The chat says so on the sent file"
shot = "video-sent"
