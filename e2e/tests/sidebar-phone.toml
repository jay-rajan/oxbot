name = "The sidebar on a phone"
about = "In the phone's drawer the search, the group-by switch and the bottom row fit, and the right-click menu (a long press) shows above the drawer."
covers = ["crates/oxbot/ui/**"]
as = "Sam"
viewport = { width = 390, height = 844 }

[[step]]
click = "Show bots"
[[step]]
expect_js = "__e2e.shown(document.getElementById('botSearch')) && __e2e.shown(document.getElementById('groupBy'))"
note = "Search and group by are in the drawer"
[[step]]
expect_js = "(() => { const side = document.getElementById('side').getBoundingClientRect(); const items = [...document.querySelectorAll('.side-foot > button')].filter((b) => !b.hidden); return items.length === 2 && items.every((b) => b.getBoundingClientRect().right <= side.right + 0.5); })()"
note = "A device's bottom row: Settings and Websites, inside the drawer"
[[step]]
right_click = "Recipes by Jay"
note = "Any bot's menu (Sam has no bot of his own: the seed's Bank was handed to the owner)"
[[step]]
expect_js = "(() => { const m = document.getElementById('botMenu'); const r = m.getBoundingClientRect(); return !m.hidden && r.left >= 0 && r.right <= innerWidth && r.bottom <= innerHeight && document.elementFromPoint(r.left + 20, r.top + 15).closest('#botMenu'); })()"
note = "The menu is on screen, above the drawer"
shot = "menu"
[[step]]
key = "Escape"
[[step]]
click = "Websites"
[[step]]
expect_js = "__e2e.shown(document.getElementById('addSiteUrl')) && document.querySelector('[data-tab=\"setSignins\"]').getAttribute('aria-selected') === 'true'"
note = "Settings → Websites, with Add a website"
