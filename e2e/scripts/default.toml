# The stand-in bots' replies (the stand-in OpenRouter and browser tool).
# The first `when` found in the message (any case) wins; the one without `when` is the fallback.

[[reply]]
when = "hello"
say = "Hello! I'm the stand-in bot."

# A schedule's run (its message says so): before the request that made it,
# whose words it repeats.
[[reply]]
when = "scheduled task they set up earlier"
say = "Day 3 plan is ready."

[[reply]]
when = "every weekday at 8:15"
tool = "schedule_task"
args = { task = "Send me today's prep plan.", rule = { kind = "weekdays", time = "08:15" } }
after = "{result}"
denied = "Okay, no schedule."

[[reply]]
when = "make a bot"
say = "I'll make that bot."
tool = "create_bot"
args = { name = "Weather Notes", instructions = "Tell me the weather when I ask." }
after = "Created it. {result}"
denied = "Okay, I didn't create it."

[[reply]]
when = "ask bank"
tool = "give_task"
args = { bot = "bank", message = "what's my balance?" }
after = "{result}"

[[reply]]
when = "ask journal"
snapshot = "## Pages\n1: Notes (https://notes.example.com/) [selected]\n## Latest page snapshot\nuid=1_1 RootWebArea \"Notes\""
tool = "give_task"
args = { bot = "journal", message = "Write down: call the plumber" }
after = "Journal says: {result}"

[[reply]]
when = "post it"
tool = "mcp__chrome-devtools__click"
args = { uid = "1_3" }
snapshot = "## Pages\n1: Jobs (https://jobs.example.com/apply) [selected]\n## Latest page snapshot\nuid=1_1 RootWebArea \"Jobs\"\n  uid=1_3 button \"Post\""
after = "Posted."
denied = "Okay, I didn't post it."

# A shop's "Add to cart" button, named with the product (amazon.ca). No
