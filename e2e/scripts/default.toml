[[reply]]
when = "read outside"
tool = "Read"
args = { file_path = "/etc/hosts" }
after = "Read it."
denied = "Okay, I didn't read that file."

# Waits a minute before its click (the stand-in OpenRouter), so a test can
# restart oxbot in the middle of the task.
[[reply]]
when = "search slowly"
tool = "mcp__chrome-devtools__click"
args = { uid = "11_4" }
snapshot = "## Pages\n1: Jobs (https://jobs.example.com/slow) [selected]\n## Latest page snapshot\nuid=11_1 RootWebArea \"Jobs\"\n  uid=11_3 searchbox \"Search jobs\"\n  uid=11_4 button \"Search\""
stall_at = 2
after = "Searched the jobs, after a restart."
denied = "Okay, I didn't search."

[[reply]]
when = "everyone's busy"
say = "Answered by the backup."
busy = ["e2e/tool-model:free"]

# The OpenRouter account's privacy settings rule out both free models.
[[reply]]
when = "privacy blocks"
say = "Not reached: no endpoint matches the account's data policy."
data_policy = ["e2e/tool-model:free", "e2e/backup:free"]

[[reply]]
when = "take your time"
say = "Done, slowly."
delay_ms = 3000

# A message with files: oxbot's note says "attached"; open each and say
# what's in it.
[[reply]]
when = "attached"
say = "Here's what I found."
read = true

[[reply]]
say = "Got it."

# Comparing engines (#21): a post on the test site (jobs.example.test, the
# e2e runner's own site), replayed as a test.
[[reply]]
when = "post the nurse job"
tool = "mcp__chrome-devtools__click"
args = { uid = "7_3" }
snapshot = "## Pages\n1: Jobs (http://jobs.example.test/post) [selected]\n## Latest page snapshot\nuid=7_1 RootWebArea \"Jobs\"\n  uid=7_2 textbox \"Title\"\n  uid=7_3 button \"Post\""
after = "Posted the nurse job."
denied = "Okay, I didn't post the nurse job."
dry = "Posted the nurse job (test run)."
