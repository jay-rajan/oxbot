[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Jayadev Rajan"]
publish = false

[workspace.dependencies]
# Internal crates
oxbot = { path = "crates/oxbot" }
oxbot-protocol = { path = "crates/oxbot-protocol" }
oxbot-core = { path = "crates/oxbot-core" }
oxbot-claude = { path = "crates/oxbot-claude" }
oxbot-engine = { path = "crates/oxbot-engine" }
oxbot-browser = { path = "crates/oxbot-browser" }
oxbot-gate = { path = "crates/oxbot-gate" }
oxbot-llm = { path = "crates/oxbot-llm" }

# External crates (versions checked 2026-10-27)
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
psl = "2.1.245"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "io-std", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

# Research reports: Markdown to HTML, with oxbot's own filter (versions
# checked 2026-11-02). Only the HTML writer: no command-line parts.
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }

# Files sent with messages: sniffing their type, and Word, Excel and
# PowerPoint to text, all in Rust on the Mac (versions checked 2026-11-02).
# Only what reading needs: no writers, no encryption, no network.
calamine = { version = "=0.38.0", default-features = false }
infer = { version = "=0.22.0", default-features = false, features = ["std"] }
quick-xml = { version = "=0.42.0", default-features = false }
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }

# The Gate link: TLS with the Farm's own certificate (versions checked 2026-10-30).
# `ring` rather than aws-lc so it cross-compiles for Android without cmake.
if-addrs = "0.15.0"
mdns-sd = "0.21.6"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# The Gate's HTTP client (already in the build through axum).
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }

# The model client for OpenRouter and (later) local OpenAI-style servers
# (versions checked 2026-11-02). reqwest without its own TLS provider: the
# client builds rustls with ring (as above) and the macOS trust store via
# the platform verifier, so no aws-lc/cmake. HTTP/2 and body streaming only.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls-platform-verifier = "=0.7.1"
# CancellationToken for stopping a model request at any await.
tokio-util = { version = "=0.7.20", default-features = false }
# Wipes the OpenRouter key from memory when it is dropped (already in the
# build through rustls).
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"

[profile.release]
lto = "thin"
strip = true
