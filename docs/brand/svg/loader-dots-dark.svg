<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 24" role="img" aria-label="Thinking">
<style>
.x{stroke:#E0242A}.o{stroke:#F2F2F0}
.p{fill:none;stroke-width:3.5;stroke-linecap:round}
.q{transform-box:fill-box;transform-origin:center;animation:bob 1.2s ease-in-out infinite both}
